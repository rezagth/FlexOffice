name: Deploy

# Builds and deploys after a green CI run:
#   develop -> staging     (automatic)
#   main    -> production  (waits for a reviewer: GitHub environment
#                           "production" with required reviewers)
#
# Images are built here and pushed to GHCR; Coolify only pulls and runs
# them. ONE IMAGE PER ENVIRONMENT: every NEXT_PUBLIC_* value is inlined in
# the browser bundle at build time, so staging and production are two
# builds of the same commit (<sha>-staging, <sha>-production).
#
# Configuration per GitHub environment (Settings -> Environments):
#   variables: APP_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#              NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, NEXT_PUBLIC_SENTRY_DSN,
#              NEXT_PUBLIC_POSTHOG_KEY, NEXT_PUBLIC_POSTHOG_HOST,
#              NEXT_PUBLIC_UMAMI_SRC, NEXT_PUBLIC_UMAMI_WEBSITE_ID,
#              SENTRY_URL, SENTRY_ORG, SENTRY_PROJECT
#   secrets:   DIRECT_URL (migrations), COOLIFY_WEBHOOK_URL, COOLIFY_TOKEN,
#              SENTRY_AUTH_TOKEN (optional, source maps)
# The migrate job runs on a self-hosted runner inside the server's network
# (labels: self-hosted, officeflex): the database is never exposed to the
# internet. See docs/runbooks/deployer.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to redeploy (current branch head)"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    name: Resolve target
    # Only a green CI run on a PUSH to this repository deploys. A pull
    # request's CI run also reports head_branch (a fork can name its branch
    # "main"), and deploying it would build fork code with this repository's
    # environment secrets and packages:write.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          DISPATCH_ENV: ${{ inputs.environment }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$DISPATCH_ENV" ]; then
            echo "environment=$DISPATCH_ENV" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$RUN_BRANCH" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and scan image
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}

      - id: meta
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          repo="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$repo:${SHA::12}-$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "moving=$repo:$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded locally first, scanned, and pushed only if clean.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ needs.target.outputs.sha }}
            APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ needs.target.outputs.environment }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_UMAMI_SRC=${{ vars.NEXT_PUBLIC_UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL/HIGH block the deploy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        run: |
          docker tag "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.moving }}"
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.moving }}"

  migrate:
    name: Apply database migrations
    needs: [target, build]
    # Inside the server's network: the database is never reachable from
    # GitHub-hosted runners.
    runs-on: [self-hosted, officeflex]
    environment: ${{ needs.target.outputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `migrate deploy` only applies committed migrations, in order, and
      # fails on drift. Migrations are expand-only by convention, so the
      # previous image keeps working until the new one is live.
      - name: prisma migrate deploy
        run: pnpm db:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

  deploy:
    name: Deploy with Coolify and smoke-test
    needs: [target, build, migrate]
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    timeout-minutes: 15
    steps:
      # The webhook queues a deployment and returns its id; wait for Coolify
      # to report it finished, otherwise the smoke test below could pass
      # against the PREVIOUS container, still serving during the rollout.
      - name: Trigger Coolify deployment and wait for it
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          response=$(curl -fsS -X GET "$COOLIFY_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_TOKEN")
          deployment=$(echo "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$deployment" ]; then
            echo "::warning::Coolify returned no deployment id; waiting 90 s instead"
            sleep 90; exit 0
          fi
          api="${COOLIFY_WEBHOOK_URL%%/api/*}/api/v1/deployments/$deployment"
          for i in $(seq 1 60); do
            status=$(curl -fsS "$api" -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -r '.status // empty')
            case "$status" in
              finished) echo "Coolify deployment $deployment finished"; exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $deployment: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Coolify deployment $deployment still '$status' after 10 minutes"
          exit 1

      # Readiness, not liveness: the database and Supabase Auth must answer
      # through the real public URL (Cloudflare -> tunnel -> Traefik).
      - name: Smoke test /api/health/ready
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health/ready" > /dev/null; then
              echo "Ready after $((i * 10)) s"; exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL/api/health/ready did not become ready in 5 minutes"
          exit 1
