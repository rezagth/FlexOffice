<title>MakomSpace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barre de démo (changer de profil), navigation MakomSpace, vues vitrine / locataire / bailleur / administrateur. Identité reprise du site actuel : marine, or, fond bleu très clair, boutons en pilule. */
:root{
  --bg:#F6F8FA; --surface:#FFFFFF; --ink:#0A1B2E; --muted:#5E6B7A; --line:#E1E6EB;
  --btn:#0A1B2E; --on-btn:#FFFFFF; --gold:#9C7A3C; --gold-soft:#F4ECDC;
  --ok:#1F7A4D; --warn:#A8691A; --bad:#B8432F; --info:#2B5FA8;
  --f:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B121B; --surface:#121C28; --ink:#E8EEF4; --muted:#93A1B1; --line:#223040;
  --btn:#E8EEF4; --on-btn:#0A1B2E; --gold:#D1AE6A; --gold-soft:#2A2418;
  --ok:#5DBB84; --warn:#E0A84A; --bad:#EE8A70; --info:#7FA8E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B121B; --surface:#121C28; --ink:#E8EEF4; --muted:#93A1B1; --line:#223040;
  --btn:#E8EEF4; --on-btn:#0A1B2E; --gold:#D1AE6A; --gold-soft:#2A2418;
  --ok:#5DBB84; --warn:#E0A84A; --bad:#EE8A70; --info:#7FA8E6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(30px,5vw,52px);font-weight:800}
h2{font-size:clamp(22px,3vw,30px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto}
.demo{max-width:1120px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12.5px;color:var(--muted);padding:6px 0}
.demo b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
nav.top{display:flex;align-items:center;gap:20px;padding:14px 0;max-width:1120px;margin:0 auto;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:17px;cursor:pointer;background:none;border:0;padding:0}
.logo b{color:var(--gold);font-weight:800}
nav.top .links{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
nav.top .links button,.navr button.link{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:600;padding:6px 10px;border-radius:999px}
nav.top .links button:hover,.navr button.link:hover{color:var(--ink)}
.navr{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--on-btn);border:1px solid var(--btn);border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14.5px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 14px;font-size:13px}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:44px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.flat{border-radius:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--btn);color:var(--on-btn);white-space:nowrap}
.tag.soft{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--ink)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.hero{display:grid;gap:28px;padding-block:20px 8px}
.hero p.lead{font-size:18px;max-width:58ch;color:var(--muted)}
.search{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:14px;display:grid;gap:10px;grid-template-columns:1.4fr 1fr .8fr .8fr .7fr auto;align-items:end;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 6%,transparent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.in{font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
.uses{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}
.use{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.use:hover{border-color:var(--gold)}
.use b{font-size:14px}
.use span{font-size:12.5px;color:var(--muted)}
.sp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-width:0;text-align:left;padding:0}
.sp:hover{border-color:var(--gold)}
.sp .ph{aspect-ratio:16/10;background:var(--bg);display:block;width:100%;border-bottom:1px solid var(--line)}
.sp .in2{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sp .t{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sp .n{font-size:17px;font-weight:700}
.price b{font-size:18px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare ul,.ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.steps .st{display:flex;flex-direction:column;gap:6px}
.steps .st i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:800}
.layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.layout.s{grid-template-columns:1fr 340px}
.side{position:sticky;top:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--gold)}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 0;text-align:center;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.slot[disabled]{cursor:not-allowed;opacity:.5;text-decoration:line-through;background:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--muted) 12%,transparent) 5px 10px)}
.slot.sel{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.slot.mid{background:color-mix(in srgb,var(--gold) 25%,transparent);border-color:var(--gold)}
.qrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}
.qrow.t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.sidenav{display:flex;flex-direction:column;gap:4px}
.sidenav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--muted)}
.sidenav button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kpi span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.week{display:grid;grid-template-columns:56px repeat(7,minmax(90px,1fr));min-width:760px;font-size:12px}
.week .hd{padding:6px 4px;font-weight:700;text-align:center;border-bottom:1px solid var(--line)}
.week .hr{padding:0 6px;color:var(--muted);text-align:right;height:30px;line-height:30px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.week .c{height:30px;border-top:1px solid var(--line);border-left:1px solid var(--line);position:relative;background:transparent;cursor:default;padding:0;border-right:0;border-bottom:0}
.week .c.closed{background:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--muted) 10%,transparent) 5px 10px)}
.week .c.can{cursor:pointer}
.week .c.can:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.ev{position:absolute;left:2px;right:2px;top:1px;bottom:1px;border-radius:6px;padding:2px 5px;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:1}
.ev.confirmée{background:color-mix(in srgb,var(--ok) 28%,var(--surface));color:var(--ink)}
.ev.acceptée{background:color-mix(in srgb,var(--ok) 28%,var(--surface));color:var(--ink)}
.ev.demande{background:color-mix(in srgb,var(--warn) 30%,var(--surface));color:var(--ink)}
.ev.block{background:color-mix(in srgb,var(--muted) 30%,var(--surface))}
.ev.ext{background:color-mix(in srgb,var(--info) 25%,var(--surface))}
.ev.buf{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 40%,transparent) 0 3px,transparent 3px 6px);border-radius:0}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:var(--r);padding:24px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--on-btn);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.msg.me{align-self:flex-end;background:var(--gold-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.code{font:800 28px/1 var(--f);letter-spacing:.3em;font-variant-numeric:tabular-nums}
footer.site{max-width:1120px;margin:0 auto;border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
@media(max-width:900px){
  .search{grid-template-columns:1fr 1fr}
  .search .btn{grid-column:1/-1}
  .uses{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.g4,.compare,.steps{grid-template-columns:1fr}
  .layout,.layout.s{grid-template-columns:1fr}
  .side{position:static}
  nav.top .links{order:3;justify-content:flex-start;flex-basis:100%}
  .slots{grid-template-columns:repeat(3,1fr)}
}
/* Accueil : bandeau marine plein écran, navigation blanche, recherche en pilule */
body.full{padding-left:0;padding-right:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hnav{background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.hin{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 20px}
.logo.big{font-size:24px;letter-spacing:.1em;font-weight:700}
.logo.big svg{width:36px;height:32px}
.logo.big b{font-weight:700}
.hl{display:flex;gap:30px}
.hl button,.mm button{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:500;font-size:17px;padding:6px 2px}
.hl button:hover,.mm button:hover{color:var(--ink)}
.hr2{display:flex;align-items:center;gap:14px}
.ic{position:relative;background:none;border:0;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:4px;border-radius:50%}
.ic:hover{color:var(--ink)}
.ic .dot{position:absolute;top:-3px;right:-5px;background:var(--bad);color:#fff;font:700 11px/1 var(--f);font-style:normal;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.burger{display:none}
.mm{display:none}
.heroband{position:relative;overflow:hidden;background:#0A1B2E;color:#fff;min-height:620px;display:grid;align-items:center;padding:70px 20px 90px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.heroband .art{position:absolute;inset:0;width:100%;height:100%}
.hc{position:relative;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;width:100%}
.hc h1{font-size:clamp(34px,6.2vw,66px);font-weight:700;letter-spacing:-.04em;line-height:1.02;max-width:15em;color:#fff}
.hc .sub{font-size:clamp(16px,2vw,22px);max-width:34em;color:rgba(255,255,255,.92)}
.hs{background:#fff;color:#0A1B2E;border-radius:999px;display:flex;align-items:stretch;gap:0;padding:12px 14px 12px 22px;width:100%;max-width:1120px;margin-top:18px;text-align:left;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.hf{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:6px 18px;border-left:1px solid #E1E6EB;color:#5E6B7A}
.hf:first-child{border-left:0;padding-left:6px}
.hf.w2{flex:1.6}
.hv{display:flex;flex-direction:column;min-width:0;flex:1}
.hl2{font-size:14px;color:#5E6B7A;font-weight:500;line-height:1.2}
.hf input,.hf select{border:0;background:transparent;color:#0A1B2E;font:500 17px/1.3 var(--f);padding:0;min-width:0;width:100%;outline:none;appearance:none;-webkit-appearance:none;color-scheme:light}
.hf input::placeholder{color:#5E6B7A;font-weight:400}
.hf:focus-within{box-shadow:inset 0 -2px 0 #9C7A3C}
.hbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#0A1B2E;color:#fff;border:0;border-radius:999px;padding:0 30px;font:700 18px var(--f);cursor:pointer;min-height:58px;margin-left:8px;flex-shrink:0}
.hbtn:focus-visible{outline:2px solid #9C7A3C;outline-offset:2px}
.big2{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.03em}
@media(max-width:1000px){
  .hl{display:none}
  .burger{display:grid}
  .mm{display:flex;flex-direction:column;gap:4px;padding:6px 20px 14px;border-top:1px solid var(--line)}
  .mm button{text-align:left;padding:10px 4px;font-size:17px}
  .hin{padding:12px 16px}
  .logo.big{font-size:19px}
  .logo.big svg{width:28px;height:25px}
  .hr2{gap:8px}
  .hr2 .btn{padding:8px 16px;font-size:14px}
  .heroband{min-height:0;padding:44px 16px 56px}
  .hs{display:grid;grid-template-columns:1fr 1fr;border-radius:26px;padding:10px;gap:0}
  .hf{border-left:0;border-bottom:1px solid #E1E6EB;padding:12px 10px}
  .hf.w2{grid-column:1/-1}
  .hf:first-child{padding-left:10px}
  .hf:nth-child(5){grid-column:1/-1;border-bottom:0}
  .hbtn{grid-column:1/-1;margin:8px 0 0;width:100%}
  .hc{gap:16px}
}
@media(max-width:420px){.hr2 .ic:not(.burger):nth-child(2){display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
'use strict';
/* ===== Utilitaires ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Math.round(n*100)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const pad=n=>String(n).padStart(2,'0');
const hm=m=>pad(Math.floor(m/60))+'h'+(m%60?pad(m%60):'');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const NOW=()=>Date.now();
const DAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const DAYS3=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const fdate=k=>{const d=new Date(k+'T00:00');return DAYS[d.getDay()]+' '+d.getDate()+'/'+pad(d.getMonth()+1)};
const tsOf=(date,min)=>new Date(date+'T00:00').getTime()+min*60000;
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r:'')};

/* ===== Référentiels ===== */
const TYPES={MEETING:'Salle de réunion',DESK:'Bureau',TRAINING:'Espace de formation',POPUP:'Boutique éphémère',STUDIO:'Studio / shooting',RDV:'Rendez-vous pro'};
const TYPE_HINT={MEETING:'Réunions, comités, ateliers',DESK:'Poste ou bureau fermé',TRAINING:'Formations, séminaires',POPUP:'Vente, showroom, lancement',STUDIO:'Photo, vidéo, tournage',RDV:'Clients, avocats, recrutement'};
const EQUIP=['Wifi','Parking','Vidéoprojecteur','Écran','Imprimante','Cuisine','Climatisation','Accès PMR','Café','Cabine téléphonique','Tableau blanc','Vitrine sur rue','Électricité renforcée','Point d\'eau','Fond photo'];
const POLICY={flex:{name:'Flexible',free:24,txt:'Remboursé jusqu\'à 24 h avant, puis 50 %'},moderate:{name:'Modérée',free:48,txt:'Remboursé jusqu\'à 48 h avant, puis 50 %'},firm:{name:'Ferme',free:168,txt:'Remboursé jusqu\'à 7 jours avant, puis 50 %'}};
const H=(o,c,sat,sun)=>({1:[o,c],2:[o,c],3:[o,c],4:[o,c],5:[o,c],6:sat?[o,sat]:null,0:sun?[o,sun]:null});
const m=h=>h*60;

/* ===== Données d'exemple ===== */

/* ===== Moteur de réservation à l'heure ===== */
let S=seed();
const sp=id=>S.spaces.find(s=>s.id===id);
function intervals(spaceId,date){
  const s=sp(spaceId),out=[];
  S.res.filter(r=>r.spaceId===spaceId&&r.date===date&&['demande','acceptée','confirmée'].includes(r.status)).forEach(r=>out.push({a:r.start,b:r.end,buf:s.buffer,kind:'res',r}));
  (S.blocks[spaceId]||[]).filter(b=>b.date===date).forEach(b=>out.push({a:b.start,b:b.end,buf:0,kind:'block',b}));
  if(S.sync.google)(S.external[spaceId]||[]).filter(b=>b.date===date).forEach(b=>out.push({a:b.start,b:b.end,buf:0,kind:'ext',b}));
  return out;
}
function cells(spaceId,date){
  const s=sp(spaceId),d=new Date(date+'T00:00'),h=s.hours[d.getDay()];
  if(!h)return null;
  const iv=intervals(spaceId,date),out=[];
  for(let t=h[0];t<h[1];t+=s.step){
    let free=true,why='';
    if(tsOf(date,t)<NOW()+s.notice*3600000){free=false;why='Préavis'}
    for(const i of iv){
      if(t<i.b+i.buf&&t+s.step+i.buf>i.a){free=false;why=(t<i.b&&t+s.step>i.a)?(i.kind==='res'?'Réservé':i.kind==='block'?'Bloqué':'Agenda externe'):'Remise en état'}
    }
    out.push({t,free,why});
  }
  return out;
}
function rangeOk(spaceId,date,start,end){
  const s=sp(spaceId),cs=cells(spaceId,date);
  if(!cs||end-start<s.min*60)return false;
  for(let t=start;t<end;t+=s.step){const c=cs.find(x=>x.t===t);if(!c||!c.free)return false}
  return true;
}
function quote(s,mins,over){
  const h=mins/60,cap=h<=4?s.half:s.half+(h-4)*s.hourly;
  const base=Math.min(h*s.hourly,cap,s.day);
  const ht=Math.round(base*100)/100;
  const feePct=over?over.fee:S.settings.fee,tvaPct=over?over.tva:S.settings.tva;
  const vat=s.vat?Math.round(ht*tvaPct)/100:0;
  const fee=Math.round(ht*feePct*1.2)/100;
  return {ht,vat,fee,total:Math.round((ht+vat+fee)*100)/100,deposit:s.deposit};
}
function startTs(r){return tsOf(r.date,r.start)}
function refundOf(r){
  const s=sp(r.spaceId),rent=r.ht+r.vat;
  if(r.status==='demande')return {rent,fee:r.fee,total:r.total,label:'Annulation gratuite avant acceptation : tout est remboursé.'};
  const hrs=(startTs(r)-NOW())/3600000,p=POLICY[s.cancel];
  if(hrs>=p.free)return {rent,fee:0,total:rent,label:'Plus de '+(p.free>=168?'7 jours':p.free+' h')+' avant le début : loyer remboursé, frais de service conservés.'};
  if(hrs>0)return {rent:rent/2,fee:0,total:rent/2,label:'Moins de '+(p.free>=168?'7 jours':p.free+' h')+' avant le début : 50 % du loyer remboursé.'};
  return {rent:0,fee:0,total:0,label:'Le créneau a commencé : aucun remboursement.'};
}

/* ===== Recherche ===== */
function results(){
  const q=U.search;
  let l=S.spaces.filter(s=>s.status==='published').filter(s=>{
    if(q.city&&!(s.city+' '+s.zone).toLowerCase().includes(q.city.toLowerCase()))return false;
    if(q.type&&s.type!==q.type)return false;
    if(q.people&&+q.people>s.cap)return false;
    if(q.max&&s.hourly>+q.max)return false;
    if(q.equip.length&&!q.equip.every(e=>s.equip.includes(e)))return false;
    if(q.date&&q.start&&q.hours){if(+q.hours<s.min)return false;if(!rangeOk(s.id,q.date,+q.start,+q.start+q.hours*60))return false}
    else if(q.date){const cs=cells(s.id,q.date);if(!cs||!cs.some(c=>c.free))return false}
    return true;
  });
  if(q.sort==='asc')l.sort((a,b)=>a.hourly-b.hourly);else if(q.sort==='desc')l.sort((a,b)=>b.hourly-a.hourly);else l.sort((a,b)=>(avgRating(b.id)||b.rating)-(avgRating(a.id)||a.rating));
  return l;
}

  +'<button class="btn ghost small" data-a="clear">Effacer les filtres</button></aside>'
  +'<div class="col"><div class="row between"><b>'+l.length+' espace'+(l.length>1?'s':'')+' trouvé'+(l.length>1?'s':'')+'</b>'+(q.date&&q.start&&q.hours?'<span class="tag ok">Libres le '+fdate(q.date)+' de '+hm(+q.start)+' à '+hm(+q.start+q.hours*60)+'</span>':'')+'</div>'

/* ===== Fiche espace ===== */
function firstOpenDate(s){for(let i=0;i<21;i++){const k=dkey(addDays(TODAY,i)),cs=cells(s.id,k);if(cs&&cs.some(c=>c.free))return k}return dkey(TODAY)}
function priceNote(s,mins){const h=mins/60,base=h*s.hourly,cap=h<=4?s.half:s.half+(h-4)*s.hourly;if(s.day<=Math.min(base,cap))return 'Forfait journée appliqué';if(cap<base)return 'Forfait demi-journée appliqué';return 'Tarif horaire'}

  if(!U.sel.date||U.sel.sp!==s.id){U.sel={date:U.search.date||firstOpenDate(s),start:U.search.start?+U.search.start:null,end:U.search.start&&U.search.hours?+U.search.start+U.search.hours*60:null,sp:s.id};if(U.sel.start!=null&&!rangeOk(s.id,U.sel.date,U.sel.start,U.sel.end)){U.sel.start=null;U.sel.end=null}}
  const sel=U.sel,cs=cells(s.id,sel.date),revs=S.reviews.filter(x=>x.sp===s.id);

    else if(!valid)panel+='<p class="small" style="color:var(--bad);font-weight:600">Ce créneau chevauche une indisponibilité.</p>';
    panel+='<div class="qrow"><span>'+hm(sel.start)+' → '+hm(sel.end)+' ('+dur(mins)+')</span><span class="muted small">'+priceNote(s,mins)+'</span></div>';
    if(valid)panel+='<div class="qrow"><span>Location HT</span><b class="tnum">'+eur(q.ht)+'</b></div>'+(s.vat?'<div class="qrow"><span>TVA 20 %</span><span class="tnum">'+eur(q.vat)+'</span></div>':'<div class="qrow"><span>TVA</span><span class="muted">Non applicable</span></div>')+'<div class="qrow"><span>Frais de service</span><span class="tnum">'+eur(q.fee)+'</span></div><div class="qrow t"><span>Total TTC</span><span class="tnum">'+eur(q.total)+'</span></div><p class="muted small">Caution : '+(q.deposit?eur(q.deposit)+' en pré-autorisation, non débitée.':'aucune.')+'</p>';

  +'<div class="layout s"><div class="col" style="gap:24px"><div class="col" style="gap:8px"><span class="muted small" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">'+TYPES[s.type]+' · '+esc(s.zone)+'</span><h1 style="font-size:clamp(26px,4vw,38px)">'+esc(s.title)+'</h1><div><button class="btn ghost small" data-a="fav" data-id="'+s.id+'">'+((S.fav||[]).includes(s.id)?'♥ Enregistré':'♡ Enregistrer')+'</button></div><p class="muted">Proposé par '+esc(s.owner)+' · jusqu\'à '+s.cap+' personnes</p><div class="row" style="gap:6px"><span class="tag">Entreprise vérifiée</span><span class="tag soft">Loué par un professionnel</span>'+(s.instant?'<span class="tag gold">Réservation immédiate</span>':'')+(revs.length?'<span class="tag soft">'+avgRating(s.id).toFixed(1)+' ★ ('+revs.length+')</span>':'')+'</div></div>'

  +'<button class="btn block" data-a="book"'+(valid?'':' disabled')+'>'+(s.instant?'Réserver immédiatement':'Envoyer la demande')+'</button><p class="muted small">'+(s.instant?'Confirmation immédiate après paiement.':'Vous ne serez débité qu\'après acceptation par l\'entreprise.')+'</p></aside></div>';
}

function accountView(){

  if(U.tab==='upcoming'){const l=all.filter(r=>['acceptée','confirmée'].includes(r.status)&&tsOf(r.date,r.end)>now);body=l.length?'<div class="grid g2">'+l.map(resCard).join('')+'</div>':'<p class="muted">Aucune réservation à venir.</p>'}
  if(U.tab==='requests'){const l=all.filter(r=>r.status==='demande');body=l.length?'<div class="grid g2">'+l.map(resCard).join('')+'</div>':'<p class="muted">Aucune demande en attente.</p>'}

function timeOptsR(sel,from,to){let o='';for(let t=from;t<=to;t+=30)o+='<option value="'+t+'"'+(+sel===t?' selected':'')+'>'+hm(t)+'</option>';return o}
function occupancy(days){
  let open=0,booked=0;
  hostSpaces().filter(s=>s.status==='published').forEach(s=>{for(let i=0;i<days;i++){const d=addDays(TODAY,i),h=s.hours[d.getDay()];if(!h)continue;open+=h[1]-h[0];S.res.filter(r=>r.spaceId===s.id&&r.date===dkey(d)&&['demande','acceptée','confirmée'].includes(r.status)).forEach(r=>{booked+=r.end-r.start})}});
  return open?Math.round(booked/open*100):0;
}

function evsOf(spaceId,date){
  const s=sp(spaceId),out=[];
  S.res.filter(r=>r.spaceId===spaceId&&r.date===date&&['demande','acceptée','confirmée'].includes(r.status)).forEach(r=>{
    if(s.buffer)out.push({a:r.start-s.buffer,b:r.start,cls:'buf',txt:''});
    out.push({a:r.start,b:r.end,cls:r.status,txt:hm(r.start)+' '+(r.company||r.renter),id:r.id});
    if(s.buffer)out.push({a:r.end,b:r.end+s.buffer,cls:'buf',txt:''});
  });
  (S.blocks[spaceId]||[]).filter(b=>b.date===date).forEach(b=>out.push({a:b.start,b:b.end,cls:'block',txt:'Bloqué'}));
  if(S.sync.google)(S.external[spaceId]||[]).filter(b=>b.date===date).forEach(b=>out.push({a:b.start,b:b.end,cls:'ext',txt:b.label}));
  return out;
}

function hostRevenue(){

  const paid=l.filter(r=>tsOf(r.date,r.end)+86400000<NOW()),up=l.filter(r=>!paid.includes(r));

  +'<div class="card scroll"><table><thead><tr><th>Date</th><th>Espace</th><th>Location HT</th><th>Commission</th><th>Net</th><th>Versement</th></tr></thead><tbody>'+l.map(r=>{const done=paid.includes(r);return '<tr><td>'+fdate(r.date)+'</td><td>'+esc(sp(r.spaceId).title)+'</td><td class="tnum">'+eur(r.ht)+'</td><td class="tnum">−'+eur(r.ht-netOf(r))+'</td><td class="tnum"><b>'+eur(netOf(r))+'</b></td><td>'+(done?'<span class="tag ok">Versé</span>':'<span class="tag soft">J+1 après le créneau</span>')+'</td></tr>'}).join('')+'</tbody></table></div><p class="muted small">Le reversement a lieu le lendemain de la fin du créneau. Vous recevez une facture de commission par mois, et la facture de location est émise en votre nom par mandat.</p>';

A.slot=d=>{
  const s=sp(U.params.id),t=+d.t,sel=U.sel;
  const freeRange=(a,b)=>{const cs=cells(s.id,sel.date);for(let x=a;x<b;x+=s.step){const c=cs&&cs.find(y=>y.t===x);if(!c||!c.free)return false}return true};
  if(sel.start==null||t<sel.end&&t>=sel.start&&sel.end-sel.start>s.step||t<sel.start){sel.start=t;sel.end=t+s.step}
  else if(t>=sel.end||t===sel.start){const end=Math.max(t+s.step,sel.start+s.step);if(freeRange(sel.start,end))sel.end=end;else{sel.start=t;sel.end=t+s.step}}
  render(true);
};

  const id='espace-'+(S.spaces.length+1);
  S.spaces.push({id,title:'Nouvel espace',type:'MEETING',city:'Paris',zone:'Paris',addr:'À compléter',pos:[.5,.3],cap:6,erp:{t:'W',c:5},surface:20,desc:'À compléter.',equip:['Wifi'],hours:H(m(9),m(18),null,null),step:60,hourly:30,half:90,day:150,min:1,buffer:30,notice:4,instant:false,vat:true,deposit:100,cancel:'moderate',rules:['À compléter'],owner:'Atelier Partners',status:'review',rating:0,nrev:0});
  S.listingsReview.push({id,checks:{photos:false,jauge:false,erp:false,regles:false}});save();A.editOpen({id});
};
/* administration */
A.adminTab=d=>{U.adminTab=d.v;render();window.scrollTo(0,0)};
A.verif=d=>{const v=S.verifs.find(x=>x.id===d.id);v.status=d.v;save();render(true);toast(d.v==='validé'?'Entreprise validée':'Entreprise refusée')};
A.lcheck=(d,el)=>{S.listingsReview.find(x=>x.id===d.id).checks[d.k]=el.checked;save();render(true)};
A.publish=d=>{sp(d.id).status='published';S.listingsReview=S.listingsReview.filter(x=>x.id!==d.id);save();render(true);toast('Annonce publiée dans la vitrine')};
A.dispute=d=>{const x=S.disputes.find(y=>y.id===d.id);x.status='résolu';x.note=d.v==='retenue'?'Montant retenu sur la caution et reversé à l\'hôte.':'Demande rejetée après examen des photos d\'état des lieux.';save();render(true)};
A.saveSettings=()=>{
  const t=U.tmp;
  if(t.commission!=null)S.settings.commission=+t.commission;if(t.fee!=null)S.settings.fee=+t.fee;if(t.tva!=null)S.settings.tva=+t.tva;
  U.tmp={};save();render(true);toast('Paramètres enregistrés');
};
A.csv=d=>{
  const text=csvOf(d.k);
  try{navigator.clipboard.writeText(text).then(()=>toast('CSV copié'),()=>{U.modal={t:'csv',text};render(true)})}catch(e){U.modal={t:'csv',text};render(true)}
};

/* ===== Événements ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(['INPUT','SELECT','TEXTAREA','FORM'].includes(el.tagName))return;
  const f=A[el.dataset.a];if(f){f(el.dataset,el,e)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a&&(el.tagName==='INPUT')){const f=A[el.dataset.a];if(f)f(el.dataset,el,e);return}
  if(el.dataset.bind){
    let v=el.type==='checkbox'?el.checked:el.value;
    if(el.type==='number'||el.dataset.num!==undefined)v=(v===''?'':Number(v));
    setPath(el.dataset.bind,v);
    if(el.dataset.reset){U.sel.start=null;U.sel.end=null}
    if(el.dataset.render!==undefined||el.type==='checkbox'&&el.dataset.bind.startsWith('edit.hrs'))render(true);
  }
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset.bind||el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date')return;
  let v=el.value;if(el.type==='number'||el.dataset.num!==undefined)v=(v===''?'':Number(v));
  setPath(el.dataset.bind,v);
  if(el.dataset.bind==='co.siret'){const m=$('#siret-msg');if(m)m.textContent=sirenOk(v)?'Établissement actif trouvé dans l\'annuaire des entreprises (contrôle simulé).':''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.modal){A.closeModal()}});

/* ===== Démarrage ===== */
(function boot(){
  load();
  const h=(location.hash||'').replace('#','');
  const map={locataire:['renter','account'],bailleur:['host','host'],admin:['admin','admin'],recherche:['visitor','search'],accueil:['visitor','home']};
  if(map[h]){S.role=map[h][0];U.route=map[h][1]}
  else if(S.role==='renter')U.route='account';else if(S.role==='host')U.route='host';else if(S.role==='admin')U.route='admin';
  render();
})();
</script>
