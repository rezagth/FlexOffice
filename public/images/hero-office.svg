<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Salle de réunion lumineuse, illustration">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2d47"/>
      <stop offset="1" stop-color="#041627"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e3bf"/>
      <stop offset="0.55" stop-color="#d9bd84"/>
      <stop offset="1" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2238"/>
      <stop offset="1" stop-color="#020b14"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5b7a"/>
      <stop offset="1" stop-color="#1b3a57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#c5a059" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c5a059" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- window wall -->
  <g transform="translate(860 90)">
    <rect width="640" height="470" rx="6" fill="url(#window)"/>
    <g stroke="#0c2d47" stroke-width="14">
      <line x1="213" y1="0" x2="213" y2="470"/>
      <line x1="426" y1="0" x2="426" y2="470"/>
      <line x1="0" y1="235" x2="640" y2="235"/>
    </g>
    <!-- city skyline seen through the glass -->
    <g fill="#c5a059" opacity="0.55">
      <rect x="20" y="300" width="60" height="170"/>
      <rect x="95" y="260" width="45" height="210"/>
      <rect x="250" y="320" width="80" height="150"/>
      <rect x="345" y="280" width="50" height="190"/>
      <rect x="460" y="300" width="70" height="170"/>
      <rect x="545" y="250" width="55" height="220"/>
    </g>
  </g>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- left wall panel and screen -->
  <rect x="120" y="150" width="520" height="300" rx="10" fill="#020b14" stroke="#3b5b7a" stroke-width="6"/>
  <rect x="150" y="180" width="460" height="240" rx="4" fill="#0f2f4c"/>
  <g fill="#c5a059" opacity="0.8">
    <rect x="190" y="340" width="40" height="50"/>
    <rect x="250" y="300" width="40" height="90"/>
    <rect x="310" y="260" width="40" height="130"/>
    <rect x="370" y="320" width="40" height="70"/>
  </g>
  <rect x="440" y="230" width="130" height="12" rx="6" fill="#e2e8f0" opacity="0.7"/>
  <rect x="440" y="262" width="100" height="12" rx="6" fill="#e2e8f0" opacity="0.5"/>
  <rect x="440" y="294" width="115" height="12" rx="6" fill="#e2e8f0" opacity="0.5"/>
  <!-- floor -->
  <path d="M0 600 L1600 600 L1600 900 L0 900 Z" fill="url(#floor)"/>
  <g stroke="#123552" stroke-width="2" opacity="0.8">
    <line x1="800" y1="600" x2="0" y2="900"/>
    <line x1="800" y1="600" x2="400" y2="900"/>
    <line x1="800" y1="600" x2="800" y2="900"/>
    <line x1="800" y1="600" x2="1200" y2="900"/>
    <line x1="800" y1="600" x2="1600" y2="900"/>
  </g>
  <!-- pendant lamps -->
  <g stroke="#3b5b7a" stroke-width="3">
    <line x1="560" y1="0" x2="560" y2="230"/>
    <line x1="800" y1="0" x2="800" y2="250"/>
    <line x1="1040" y1="0" x2="1040" y2="230"/>
  </g>
  <g fill="#c5a059">
    <path d="M520 230 h80 l-15 30 h-50 z"/>
    <path d="M760 250 h80 l-15 30 h-50 z"/>
    <path d="M1000 230 h80 l-15 30 h-50 z"/>
  </g>
  <!-- chairs behind the table -->
  <g fill="#123552">
    <rect x="420" y="530" width="90" height="120" rx="18"/>
    <rect x="600" y="530" width="90" height="120" rx="18"/>
    <rect x="780" y="530" width="90" height="120" rx="18"/>
    <rect x="960" y="530" width="90" height="120" rx="18"/>
    <rect x="1140" y="530" width="90" height="120" rx="18"/>
  </g>
  <!-- table -->
  <path d="M300 640 L1340 640 L1460 720 L180 720 Z" fill="url(#table)"/>
  <rect x="180" y="720" width="1280" height="18" fill="#0c2d47"/>
  <rect x="300" y="738" width="22" height="130" fill="#0c2d47"/>
  <rect x="1318" y="738" width="22" height="130" fill="#0c2d47"/>
  <!-- laptops and notebooks -->
  <g fill="#e2e8f0" opacity="0.85">
    <path d="M470 650 h90 l10 28 h-110 z"/>
    <path d="M860 650 h90 l10 28 h-110 z"/>
    <path d="M1160 650 h90 l10 28 h-110 z"/>
  </g>
  <g fill="#c5a059">
    <rect x="680" y="664" width="70" height="10" rx="3"/>
    <rect x="1010" y="664" width="60" height="10" rx="3"/>
  </g>
  <!-- plant -->
  <rect x="1480" y="610" width="60" height="80" rx="8" fill="#0c2d47"/>
  <g fill="#3b5b7a">
    <ellipse cx="1510" cy="580" rx="22" ry="48"/>
    <ellipse cx="1485" cy="595" rx="16" ry="36" transform="rotate(-25 1485 595)"/>
    <ellipse cx="1535" cy="595" rx="16" ry="36" transform="rotate(25 1535 595)"/>
  </g>
</svg>
